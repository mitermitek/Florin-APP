<div role="presentation">
  <div role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div>
      <h3 id="dialog-title">{{ title() }}</h3>
    </div>

    <div>
      <ng-content />
    </div>

    <div>
      <button type="button" (click)="cancel()">Fermer</button>

      @if (formId()) {
        <button
          type="submit"
          [attr.form]="formId()"
          [disabled]="disabled()"
        >
          Enregistrer
        </button>
      } @else {
        <button type="button" (click)="validate()">Valider</button>
      }
    </div>
  </div>
</div>
